name: obtainium
description: Get Android app updates straight from the source.
publish_to: 'none'

version: 1.6.17-p8+2479

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  path_provider: ^2.1.6
  flutter_fgbg: ^0.8.0
  flutter_local_notifications: ^22.3.0
  provider: ^6.1.5+1
  http: ^1.6.0
  webview_flutter: ^4.14.1
  dynamic_color: ^1.9.0
  material_ui: ^1.2.0
  material_color_utilities: ^0.13.0
  html: ^0.15.7
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  permission_handler: ^13.0.2
  fluttertoast: ^10.0.0
  device_info_plus: ^13.2.0
  file_picker: ^12.3.0
  animations: ^3.0.0
  loading_indicator_m3e: ^0.1.1
  android_package_installer: # TODO: Upstream PR pending; if not accepted, keep fork maintained
    git:
      url: https://github.com/ImranR98/android_package_installer
      ref: 94525707bd1fba8cba4d19b4cb2b928580913510
  android_package_manager: # TODO: Submit PR to upstream and switch back when merged
    git:
      url: https://github.com/ImranR98/android_package_manager
      ref: b5bc0365bd7faab6f51f6ec8baf4a9dab0df9117
  share_plus: ^13.3.0
  sqflite: ^2.4.4
  easy_localization: ^3.0.8
  intl: ^0.20.3
  android_intent_plus: ^6.1.0
  flutter_archive: ^6.3.1
  archive: ^4.2.0
  hsluv: ^1.1.3
  connectivity_plus: ^7.3.1
  shared_storage: # Actively maintained fork (more current than upstream); no action needed
    git:
      url: https://github.com/AlexBacich/shared-storage
      ref: 6dbcdf2c2045e326f59c062f542724aedf73cb6e
  crypto: ^3.0.7
  bcrypt: ^1.2.0
  app_links: ^7.2.1
  equations: ^6.0.0
  flex_color_picker: ^4.0.0
  android_system_font: # re7gog archived 2026-01-19; ImranR98 fork is AGP-9-compatible
    git:
      url: https://github.com/ImranR98/android_system_font
      ref: 7efa523a0cb40fb243318450c60dfd0e882e6b0c
  shizuku_apk_installer: # Upstream (re7gog) archived 2026-07-10; using self-maintained fork
    git:
      url: https://github.com/thejaustin/shizuku_apk_installer
      ref: 3ef7f8fbf904848d144304556b0f80c91fee82a5
  markdown: ^7.3.1
  flutter_typeahead: ^6.0.0
  battery_plus: ^7.1.1
  flutter_charset_detector: ^6.0.0
  protobuf: ^3.1.0
  flutter_markdown_plus: ^1.0.12
  background_fetch: ^1.7.0
  flutter_foreground_task: ^11.0.3
  go_router: ^17.2.3
  shimmer: ^3.0.0
  introduction_screen: ^4.0.0
  sentry_flutter: ^8.14.2
  flutter_secure_storage: ^10.2.0
  encrypt: ^5.0.3
  flutter_js: ^0.8.7
  home_widget: ^0.9.3
  workmanager: ^0.10.10
  logger: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  image_path: "assets/graphics/icon.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/graphics/icon_small.png
    - assets/graphics/
    - assets/ca-certs/

  fonts:
      - family: Montserrat
        fonts:
          - asset: assets/fonts/Montserrat-Regular.ttf
