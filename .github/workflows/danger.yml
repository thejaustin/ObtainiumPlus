name: Danger

on:
  pull_request:
    branches:
      - main

jobs:
  danger:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore pub-global cache
        id: pub-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.pub-cache
          key: pub-global-danger_dart-${{ runner.os }}

      - name: Get dependencies
        run: flutter pub get

      - name: Activate danger_dart
        run: flutter pub global activate danger_dart

      - name: Save pub-global cache
        if: steps.pub-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.pub-cache
          key: pub-global-danger_dart-${{ runner.os }}

      - name: Install danger
        run: npm ci

      - name: Run Danger
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.DANGER_GITHUB_API_TOKEN }}
        run: |
          export PATH="$PATH:$HOME/.pub-cache/bin:$GITHUB_WORKSPACE/node_modules/.bin"
          danger_dart ci
