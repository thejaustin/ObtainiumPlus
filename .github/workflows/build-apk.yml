name: Build APK

on:
  push:
    branches:
      - main
      - 'feature/*'
  workflow_dispatch:
    inputs:
      beta:
        type: boolean
        description: Mark as pre-release?
        default: false

jobs:
  quality:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Validate locale JSON files
        run: |
          echo "Checking all translation JSON files for syntax errors..."
          failed=0
          for f in assets/translations/*.json; do
            if ! python3 -c "import json,sys; json.load(open('$f'))" 2>/dev/null; then
              echo "❌ Invalid JSON: $f"
              failed=1
            else
              echo "✅ $f"
            fi
          done
          if [ $failed -ne 0 ]; then
            exit 1
          fi

      - name: Flutter Analyze
        run: flutter analyze

      - name: Flutter Test
        run: flutter test

  build:
    name: Build and Release
    needs: quality
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'chore: Auto-bump version') }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect Build Type
        id: detect_build
        run: |
          IS_DEV=false
          if [[ "${{ github.ref }}" == refs/heads/feature/* ]]; then
            IS_DEV=true
          fi
          echo "is_dev=$IS_DEV" >> $GITHUB_OUTPUT

      - name: Auto-bump version
        id: bump_version
        if: steps.detect_build.outputs.is_dev != 'true'
        run: |
          FULL_VERSION=$(grep "^version: " pubspec.yaml | cut -d' ' -f2)
          CURRENT_VERSION=$(echo "$FULL_VERSION" | cut -d'+' -f1)
          CURRENT_BUILD=$(echo "$FULL_VERSION" | cut -d'+' -f2)

          if [[ "$CURRENT_VERSION" =~ ^(.+)-p([0-9]+)$ ]]; then
            BASE_VERSION="${BASH_REMATCH[1]}"
            PATCH_NUM="${BASH_REMATCH[2]}"
          else
            BASE_VERSION="$CURRENT_VERSION"
            PATCH_NUM="0"
          fi

          NEW_PATCH=$((PATCH_NUM + 1))
          NEW_BUILD=$((CURRENT_BUILD + 1))
          NEW_VERSION="${BASE_VERSION}-p${NEW_PATCH}"

          sed -i "s/^version: .*/version: ${NEW_VERSION}+${NEW_BUILD}/" pubspec.yaml

          if git diff --quiet pubspec.yaml; then
            echo "version_changed=false" >> $GITHUB_OUTPUT
          else
            echo "version_changed=true" >> $GITHUB_OUTPUT
          fi

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$NEW_BUILD" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Platform 36
        run: sdkmanager "platforms;android-36"

      - name: Get dependencies
        run: flutter pub get

      - name: Validate Secrets
        id: check_secrets
        run: |
          has_secrets=true
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ] || [ -z "${{ secrets.KEY_ALIAS }}" ]; then
            has_secrets=false
          fi
          echo "has_secrets=$has_secrets" >> $GITHUB_OUTPUT

      - name: Setup Keystore
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release-keystore.jks\n' \
            '${{ secrets.KEYSTORE_PASSWORD }}' \
            '${{ secrets.KEY_PASSWORD }}' \
            '${{ secrets.KEY_ALIAS }}' \
            > android/key.properties

      - name: Build APK
        run: |
          flutter build apk --flavor normal --no-pub --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}"
          find build/app/outputs/flutter-apk/ -name "app-*normal*.apk" -exec bash -c 'mv "$1" "${1//-normal/}"' -- {} \;
          if [ "${{ steps.detect_build.outputs.is_dev }}" = "true" ]; then
            mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Obtainium-Plus-Dev.apk
          fi
          rm -f ./build/app/outputs/flutter-apk/*.sha1

      - name: Cache Sentry CLI
        id: cache-sentry
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/sentry-cli
          key: ${{ runner.os }}-sentry-cli

      - name: Install Sentry CLI
        if: steps.cache-sentry.outputs.cache-hit != 'true' && secrets.SENTRY_AUTH_TOKEN != ''
        run: curl -sL https://sentry.io/get-cli/ | bash

      - name: Upload Sentry Debug Symbols
        if: secrets.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          MAPPING_FILE="build/app/outputs/flutter-apk/app-release-mapping.txt"
          if [ -f "$MAPPING_FILE" ]; then
            sentry-cli upload-proguard "$MAPPING_FILE"
          fi

      - name: Generate Changelog
        id: build_changelog
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          COMMIT_RANGE=$([ -z "$PREVIOUS_TAG" ] && echo "HEAD~1..HEAD" || echo "$PREVIOUS_TAG..HEAD")
          
          # Use user-friendly changelog if available
          if [ -f "CHANGELOG_USER.md" ] && [ -s "CHANGELOG_USER.md" ]; then
            USER_CHANGELOG=$(cat CHANGELOG_USER.md)
            CHANGELOG="### What's New\n$USER_CHANGELOG\n\n### Developer Details\n"
            CHANGELOG+=$(git log $COMMIT_RANGE --pretty=format:'* **%s** (%h)' --no-merges)
          else
            CHANGELOG=$(git log $COMMIT_RANGE --pretty=format:'* **%s** (%h)%n%b' --no-merges)
            [ -z "$CHANGELOG" ] && CHANGELOG="No significant changes."
          fi
          
          [ ${#CHANGELOG} -gt 10000 ] && CHANGELOG="${CHANGELOG:0:10000}... (truncated)"

          cat <<EOF > release_body.md
**Obtainium+ ${{ (steps.detect_build.outputs.is_dev == 'true' && 'Dev Build') || 'Automated Build' }}**

- **Build #:** ${{ github.run_number }}
- **Commit:** ${{ github.sha }}
- **Date:** $(date)

$CHANGELOG
EOF

      - name: Commit version bump
        if: steps.bump_version.outputs.version_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: Auto-bump version to ${{ steps.bump_version.outputs.version }}"
          git push origin HEAD:main

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obtainium-plus-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ (steps.detect_build.outputs.is_dev == 'true' && format('dev-{0}', github.run_number)) || steps.bump_version.outputs.version && format('v{0}', steps.bump_version.outputs.version) || format('build-{0}', github.run_number) }}
          name: "${{ (steps.detect_build.outputs.is_dev == 'true' && format('Obtainium+ Dev Build #{0}', github.run_number)) || format('Obtainium+ {0}', steps.bump_version.outputs.version) }}"
          draft: false
          prerelease: ${{ steps.detect_build.outputs.is_dev == 'true' }}
          generateReleaseNotes: false
          artifacts: "build/app/outputs/flutter-apk/*.apk"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          bodyFile: release_body.md

  sync-sentry-issues:
    needs: build
    uses: ./.github/workflows/sentry-sync.yml
    secrets: inherit
    permissions:
      issues: write
