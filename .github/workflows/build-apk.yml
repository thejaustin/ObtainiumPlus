name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      beta:
        type: boolean
        description: Mark as pre-release?
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip if commit was from auto-bump to prevent infinite loop
    if: "!contains(github.event.head_commit.message, 'Auto-bump version')"
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-bump version
        id: bump_version
        run: |
          # Extract current version
          CURRENT_VERSION=$(grep -oP "^version: \K[^\+]+" pubspec.yaml)
          CURRENT_BUILD=$(grep -oP "^version: .*\+\K.*" pubspec.yaml)

          echo "Current version: $CURRENT_VERSION (build $CURRENT_BUILD)"

          # Extract base version and patch number (e.g., 1.2.9-p24 -> base=1.2.9, patch=24)
          if [[ $CURRENT_VERSION =~ ^(.+)-p([0-9]+)$ ]]; then
            BASE_VERSION="${BASH_REMATCH[1]}"
            PATCH_NUM="${BASH_REMATCH[2]}"
          else
            BASE_VERSION="$CURRENT_VERSION"
            PATCH_NUM="0"
          fi

          # Increment patch and build numbers
          NEW_PATCH=$((PATCH_NUM + 1))
          NEW_BUILD=$((CURRENT_BUILD + 1))
          NEW_VERSION="${BASE_VERSION}-p${NEW_PATCH}"

          echo "New version: $NEW_VERSION (build $NEW_BUILD)"

          # Update pubspec.yaml
          sed -i "s/^version: .*/version: ${NEW_VERSION}+${NEW_BUILD}/" pubspec.yaml

          # Check if version actually changed
          if git diff --quiet pubspec.yaml; then
            echo "version_changed=false" >> $GITHUB_OUTPUT
            echo "⚠️ Version already up to date"
          else
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "✅ Version bumped to $NEW_VERSION+$NEW_BUILD"
          fi

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$NEW_BUILD" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Setup Keystore
        run: |
          echo "Creating keystore from secret..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release-keystore.jks
          echo "Keystore created successfully"

          echo "Creating key.properties file..."
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=release-keystore.jks
          EOF
          echo "key.properties created successfully"

      - name: Build APK
        run: |
          echo "Building universal APK (Obtainium Plus)..."
          flutter build apk --flavor normal

          echo "Renaming APK to remove flavor suffix..."
          for file in build/app/outputs/flutter-apk/app-*normal*.apk; do
            if [ -f "$file" ]; then
              mv "$file" "${file//-normal/}"
            fi
          done

          echo "Cleaning up SHA1 files..."
          rm -f ./build/app/outputs/flutter-apk/*.sha1

          echo "Built APK:"
          ls -lh ./build/app/outputs/flutter-apk/

      - name: Generate Changelog
        id: build_changelog
        run: |
          # Get previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found. Listing all commits."
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" --no-merges)
          else
            echo "Generating changelog since $PREVIOUS_TAG"
            CHANGELOG=$(git log $PREVIOUS_TAG..HEAD --pretty=format:"* %s (%h)" --no-merges)
          fi
          
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No significant changes."
          fi
          
          DELIMITER=$(openssl rand -hex 8)
          echo "changelog<<$DELIMITER" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "$DELIMITER" >> $GITHUB_OUTPUT

      - name: Commit version bump
        id: commit_bump
        if: steps.bump_version.outputs.version_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "Auto-bump version to ${{ steps.bump_version.outputs.version }}"
          git push
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obtainium-plus-apks-${{ steps.bump_version.outputs.version }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.bump_version.outputs.tag }}
          name: "Obtainium+ ${{ steps.bump_version.outputs.version }}"
          commit: ${{ steps.commit_bump.outputs.sha || github.sha }}
          draft: false
          prerelease: ${{ inputs.beta || false }}
          generateReleaseNotes: true
          artifacts: "build/app/outputs/flutter-apk/*.apk"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          skipIfReleaseExists: false
          body: |
            ## Obtainium+ ${{ steps.bump_version.outputs.version }}

            **Build:** ${{ steps.bump_version.outputs.build_number }}
            **Commit:** ${{ github.sha }}

            ---

            ### 📝 Changes
            ${{ steps.build_changelog.outputs.changelog }}
