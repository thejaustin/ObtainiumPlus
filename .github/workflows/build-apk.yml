name: Build APK

on:
  push:
    branches:
      - main
      - 'feature/*'
  workflow_dispatch:
    inputs:
      beta:
        type: boolean
        description: Mark as pre-release?
        default: false
      full_release:
        type: boolean
        description: Produce an official full release (no -p suffix)?
        default: false

jobs:
  quality:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Validate locale JSON files
        run: |
          echo "Checking all translation JSON files for syntax errors..."
          failed=0
          for f in assets/translations/*.json; do
            if ! python3 -c "import json,sys; json.load(open('$f'))" 2>/dev/null; then
              echo "❌ Invalid JSON: $f"
              failed=1
            else
              echo "✅ $f"
            fi
          done
          if [ $failed -ne 0 ]; then
            exit 1
          fi

      - name: Flutter Analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: Flutter Test
        run: flutter test

  build:
    name: Build and Release
    needs: quality
    runs-on: ubuntu-latest
    if: "${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'chore: Auto-bump version') }}"
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect Build Type
        id: detect_build
        run: |
          IS_DEV=false
          if [[ "${{ github.ref }}" == refs/heads/feature/* ]]; then
            IS_DEV=true
          fi
          if [ "${{ inputs.beta }}" = "true" ]; then
            IS_DEV=true
          fi
          echo "is_dev=$IS_DEV" >> $GITHUB_OUTPUT

      - name: Auto-bump version
        id: bump_version
        if: steps.detect_build.outputs.is_dev != 'true'
        env:
          INPUT_FULL_RELEASE: ${{ inputs.full_release }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          FULL_VERSION=$(grep "^version: " pubspec.yaml | cut -d' ' -f2)
          CURRENT_VERSION=$(echo "$FULL_VERSION" | cut -d'+' -f1)
          CURRENT_BUILD=$(echo "$FULL_VERSION" | cut -d'+' -f2)

          IS_FULL_RELEASE=false
          if [ "$INPUT_FULL_RELEASE" = "true" ] || echo "$COMMIT_MSG" | grep -qiE '\[full[- ]release\]|^chore: release'; then
            IS_FULL_RELEASE=true
          fi

          BASE_VERSION=$(echo "$CURRENT_VERSION" | sed -E 's/-[pr][0-9]+$//')

          if [ "$IS_FULL_RELEASE" = "true" ]; then
            # Full release: change -p to -r and reset to 1, or bump existing -r
            LATEST_R=$(git tag -l "v${BASE_VERSION}-r*" | sed -E 's/.*-r//' | sort -n | tail -n 1)
            NEW_R=1
            if [ -n "$LATEST_R" ]; then
              if [ "$CURRENT_VERSION" = "${BASE_VERSION}-r${LATEST_R}" ]; then
                NEW_R=$LATEST_R
              else
                NEW_R=$((LATEST_R + 1))
              fi
            fi
            NEW_VERSION="${BASE_VERSION}-r${NEW_R}"
            if [ "$CURRENT_VERSION" = "$NEW_VERSION" ]; then
              NEW_BUILD=$CURRENT_BUILD
            else
              NEW_BUILD=$((CURRENT_BUILD + 1))
            fi
          elif [[ "$CURRENT_VERSION" =~ ^(.+)-p([0-9]+)$ ]]; then
            PATCH_NUM="${BASH_REMATCH[2]}"
            NEW_PATCH=$((PATCH_NUM + 1))
            NEW_BUILD=$((CURRENT_BUILD + 1))
            NEW_VERSION="${BASE_VERSION}-p${NEW_PATCH}"
          elif [[ "$CURRENT_VERSION" =~ ^(.+)-r([0-9]+)$ ]]; then
            # Starting new development cycle after a release
            NEW_VERSION="${BASE_VERSION}-p1"
            NEW_BUILD=$((CURRENT_BUILD + 1))
          else
            NEW_PATCH=1
            NEW_BUILD=$((CURRENT_BUILD + 1))
            NEW_VERSION="${CURRENT_VERSION}-p${NEW_PATCH}"
          fi

          sed -i "s/^version: .*/version: ${NEW_VERSION}+${NEW_BUILD}/" pubspec.yaml
          sed -i "s/^const currentObtainiumPlusVersion = .*/const currentObtainiumPlusVersion = '${NEW_VERSION}';/" lib/utils/version_constant.dart

          if git diff --quiet pubspec.yaml; then
            echo "version_changed=false" >> $GITHUB_OUTPUT
          else
            echo "version_changed=true" >> $GITHUB_OUTPUT
          fi

          echo "is_full_release=$IS_FULL_RELEASE" >> $GITHUB_OUTPUT
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$NEW_BUILD" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Platform 36
        run: sdkmanager "platforms;android-36"

      - name: Get dependencies
        run: flutter pub get

      - name: Validate Secrets
        id: check_secrets
        run: |
          has_secrets=true
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ] || [ -z "${{ secrets.KEY_ALIAS }}" ]; then
            has_secrets=false
          fi
          echo "has_secrets=$has_secrets" >> $GITHUB_OUTPUT
          has_sentry=true
          if [ -z "${{ secrets.SENTRY_AUTH_TOKEN }}" ]; then
            has_sentry=false
          fi
          echo "has_sentry_token=$has_sentry" >> $GITHUB_OUTPUT

      - name: Setup Keystore
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release-keystore.jks\n' \
            '${{ secrets.KEYSTORE_PASSWORD }}' \
            '${{ secrets.KEY_PASSWORD }}' \
            '${{ secrets.KEY_ALIAS }}' \
            > android/key.properties

      - name: Build APK
        run: |
          flutter build apk --flavor normal --no-pub --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}"
          find build/app/outputs/flutter-apk/ -name "app-*normal*.apk" -exec bash -c 'mv "$1" "${1//-normal/}"' -- {} \;
          if [ "${{ steps.detect_build.outputs.is_dev }}" = "true" ]; then
            mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Obtainium-Plus-Dev.apk
          fi
          rm -f ./build/app/outputs/flutter-apk/*.sha1

      - name: Cache Sentry CLI
        id: cache-sentry
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/sentry-cli
          key: ${{ runner.os }}-sentry-cli

      - name: Install Sentry CLI
        if: steps.cache-sentry.outputs.cache-hit != 'true' && steps.check_secrets.outputs.has_sentry_token == 'true'
        run: curl -sL https://sentry.io/get-cli/ | bash

      - name: Upload Sentry Debug Symbols
        if: steps.check_secrets.outputs.has_sentry_token == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          MAPPING_FILE="build/app/outputs/flutter-apk/app-release-mapping.txt"
          if [ -f "$MAPPING_FILE" ]; then
            sentry-cli upload-proguard "$MAPPING_FILE"
          fi

      - name: Generate Changelog
        id: build_changelog
        run: |
          TAG_NAME="${{ (steps.detect_build.outputs.is_dev == 'true' && format('dev-{0}', github.run_number)) || format('v{0}', steps.bump_version.outputs.version) }}"
          PREV_TAG=$(git tag --list 'v*' --sort=-creatordate | head -1)
          if [ -f "CHANGELOG_USER.md" ] && [ "${{ steps.bump_version.outputs.is_full_release }}" = "true" ]; then
            {
              cat CHANGELOG_USER.md
              echo
              if [ -n "$PREV_TAG" ]; then
                echo "---"
                echo "[Full Changelog](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG_NAME})"
              fi
              echo
              echo "---"
              echo "[![Co-developed with Antigravity](https://img.shields.io/badge/Co--developed%20with-Antigravity-4285F4?style=flat-square&logo=google&logoColor=white)](https://deepmind.google)"
            } > release_body.md
          else
            {
              printf '**Obtainium+ %s** — build #%s, commit `%s`, %s\n\n' \
                "${{ (steps.detect_build.outputs.is_dev == 'true' && 'Dev Build') || steps.bump_version.outputs.version }}" \
                "${{ github.run_number }}" \
                "${GITHUB_SHA:0:8}" \
                "$(date -u '+%Y-%m-%d %H:%M UTC')"

              if [ -n "$PREV_TAG" ]; then
                RANGE="${PREV_TAG}..HEAD"
                echo "## Changes since ${PREV_TAG}"
              else
                RANGE="HEAD"
                echo "## Recent Changes"
              fi
              echo

              FEATS=$(git log "$RANGE" --no-merges --grep='^feat' --pretty=format:'- %s (%h)' || true)
              if [ -n "$FEATS" ]; then
                echo "### ✨ New Features"
                echo "$FEATS"
                echo
              fi

              FIXES=$(git log "$RANGE" --no-merges --grep='^fix' --pretty=format:'- %s (%h)' || true)
              if [ -n "$FIXES" ]; then
                echo "### 🐛 Bug Fixes"
                echo "$FIXES"
                echo
              fi

              OTHERS=$(git log "$RANGE" --no-merges --grep='^feat' --grep='^fix' --grep='^chore: Auto-bump' --invert-grep --pretty=format:'- %s (%h)' || true)
              if [ -n "$OTHERS" ]; then
                echo "### 🔧 Improvements & Maintenance"
                echo "$OTHERS"
                echo
              fi

              if [ -n "$PREV_TAG" ]; then
                echo
                echo "---"
                echo "[Full Changelog](https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG_NAME})"
              fi
            } > release_body.md
          fi

      - name: Commit version bump
        if: steps.bump_version.outputs.version_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml lib/utils/version_constant.dart
          git commit -m "chore: Auto-bump version to ${{ steps.bump_version.outputs.version }}"
          # Rebase in case a commit landed on main while this run was building;
          # autostash because the build leaves unstaged changes (pubspec.lock)
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obtainium-plus-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ (steps.detect_build.outputs.is_dev == 'true' && format('dev-{0}', github.run_number)) || steps.bump_version.outputs.version && format('v{0}', steps.bump_version.outputs.version) || format('build-{0}', github.run_number) }}
          name: "${{ (steps.detect_build.outputs.is_dev == 'true' && format('Obtainium+ Dev Build #{0}', github.run_number)) || format('Obtainium+ {0}', steps.bump_version.outputs.version) }}"
          draft: false
          prerelease: ${{ steps.detect_build.outputs.is_dev == 'true' }}
          generateReleaseNotes: false
          artifacts: "build/app/outputs/flutter-apk/*.apk"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          bodyFile: release_body.md

  sync-sentry-issues:
    needs: build
    uses: ./.github/workflows/sentry-sync.yml
    secrets: inherit
    permissions:
      issues: write
