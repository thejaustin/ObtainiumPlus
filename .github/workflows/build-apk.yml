name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      beta:
        type: boolean
        description: Mark as pre-release?
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip if commit was from auto-bump to prevent infinite loop
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'Auto-bump version') }}
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-bump version
        id: bump_version
        run: |
          # Extract current version
          CURRENT_VERSION=$(grep -oP "^version: \K[^\+]+" pubspec.yaml)
          CURRENT_BUILD=$(grep -oP "^version: .*\+\K.*" pubspec.yaml)

          echo "Current version: $CURRENT_VERSION (build $CURRENT_BUILD)"

          # Extract base version and patch number (e.g., 1.2.9-p24 -> base=1.2.9, patch=24)
          if [[ $CURRENT_VERSION =~ ^(.+)-p([0-9]+)$ ]]; then
            BASE_VERSION="${BASH_REMATCH[1]}"
            PATCH_NUM="${BASH_REMATCH[2]}"
          else
            BASE_VERSION="$CURRENT_VERSION"
            PATCH_NUM="0"
          fi

          # Increment patch and build numbers
          NEW_PATCH=$((PATCH_NUM + 1))
          NEW_BUILD=$((CURRENT_BUILD + 1))
          NEW_VERSION="${BASE_VERSION}-p${NEW_PATCH}"

          echo "New version: $NEW_VERSION (build $NEW_BUILD)"

          # Update pubspec.yaml
          sed -i "s/^version: .*/version: ${NEW_VERSION}+${NEW_BUILD}/" pubspec.yaml

          # Check if version actually changed
          if git diff --quiet pubspec.yaml; then
            echo "version_changed=false" >> $GITHUB_OUTPUT
            echo "⚠️ Version already up to date"
          else
            echo "version_changed=true" >> $GITHUB_OUTPUT
            echo "✅ Version bumped to $NEW_VERSION+$NEW_BUILD"
          fi

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$NEW_BUILD" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Validate locale JSON files
        run: |
          echo "Checking all translation JSON files for syntax errors..."
          failed=0
          for f in assets/translations/*.json; do
            if ! python3 -c "import json,sys; json.load(open('$f'))" 2>/dev/null; then
              echo "❌ Invalid JSON: $f"
              python3 -c "import json,sys; json.load(open('$f'))" 2>&1 || true
              failed=1
            else
              echo "✅ $f"
            fi
          done
          if [ $failed -ne 0 ]; then
            echo "ERROR: One or more locale JSON files are invalid. Fix before building."
            exit 1
          fi

      - name: Validate Secrets
        id: check_secrets
        run: |
          has_secrets=true
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ] || [ -z "${{ secrets.KEYSTORE_PASSWORD }}" ] || [ -z "${{ secrets.KEY_PASSWORD }}" ] || [ -z "${{ secrets.KEY_ALIAS }}" ]; then
            echo "⚠️ WARNING: Signing secrets are missing. Building unsigned APK."
            echo "To enable signing, configure these secrets:"
            echo "- KEYSTORE_BASE64"
            echo "- KEYSTORE_PASSWORD"
            echo "- KEY_PASSWORD"
            echo "- KEY_ALIAS"
            has_secrets=false
          else
            echo "✅ Signing secrets found"
          fi
          echo "has_secrets=$has_secrets" >> $GITHUB_OUTPUT

      - name: Setup Keystore
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          echo "Creating keystore from secret..."
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release-keystore.jks
          echo "Keystore created successfully"

          echo "Creating key.properties file..."
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release-keystore.jks\n' \
            '${{ secrets.KEYSTORE_PASSWORD }}' \
            '${{ secrets.KEY_PASSWORD }}' \
            '${{ secrets.KEY_ALIAS }}' \
            > android/key.properties
          echo "key.properties created successfully"

      - name: Build APK
        run: |
          echo "Building universal APK (Obtainium Plus)..."
          flutter build apk --flavor normal --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}"

          echo "Renaming APK to remove flavor suffix..."
          for file in build/app/outputs/flutter-apk/app-*normal*.apk; do
            if [ -f "$file" ]; then
              mv "$file" "${file//-normal/}"
            fi
          done

          echo "Building split APKs by ABI (Obtainium Plus)..."
          flutter build apk --split-per-abi --flavor normal --dart-define=SENTRY_DSN="${{ secrets.SENTRY_DSN }}"

          echo "Renaming split APKs to remove flavor suffix..."
          for file in build/app/outputs/flutter-apk/app-*normal*-*.apk; do
            if [ -f "$file" ]; then
              mv "$file" "${file//-normal/}"
            fi
          done

          echo "Cleaning up SHA1 files..."
          rm -f ./build/app/outputs/flutter-apk/*.sha1

          echo "Built APKs:"
          ls -lh ./build/app/outputs/flutter-apk/

      - name: Check Sentry Token
        id: check_sentry
        run: |
          if [ -n "${{ secrets.SENTRY_AUTH_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Sentry Debug Symbols
        if: steps.check_sentry.outputs.has_token == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          curl -sL https://sentry.io/get-cli/ | bash
          MAPPING_FILE="build/app/outputs/flutter-apk/app-release-mapping.txt"
          if [ -f "$MAPPING_FILE" ]; then
            sentry-cli upload-proguard "$MAPPING_FILE"
          else
            echo "⚠️ Sentry mapping file not found at $MAPPING_FILE - skipping upload."
            ls -R build/app/outputs/ || true
          fi

      - name: Generate Changelog
        id: build_changelog
        run: |
          # Get previous tag
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found. Using last commit only."
            COMMIT_RANGE="HEAD~1..HEAD"
          else
            echo "Generating changelog since $PREVIOUS_TAG"
            COMMIT_RANGE="$PREVIOUS_TAG..HEAD"
          fi

          # Generate detailed changelog with full commit body (like AutoCat)
          # This includes co-authorship info from commit messages
          CHANGELOG=""
          while IFS= read -r commit_hash; do
            if [ -n "$commit_hash" ]; then
              SUBJECT=$(git log -1 --pretty=format:'%s' "$commit_hash")
              BODY=$(git log -1 --pretty=format:'%b' "$commit_hash" | sed '/^$/d')
              SHORT_HASH=$(git log -1 --pretty=format:'%h' "$commit_hash")

              if [ -n "$CHANGELOG" ]; then
                CHANGELOG="${CHANGELOG}

          ---

          "
              fi

              CHANGELOG="${CHANGELOG}**${SUBJECT}** (\`${SHORT_HASH}\`)"

              if [ -n "$BODY" ]; then
                CHANGELOG="${CHANGELOG}

          ${BODY}"
              fi
            fi
          done < <(git log $COMMIT_RANGE --pretty=format:'%H' --no-merges)

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="No significant changes."
          fi

          DELIMITER=$(openssl rand -hex 8)
          echo "changelog<<$DELIMITER" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "$DELIMITER" >> $GITHUB_OUTPUT

      - name: Commit version bump
        id: commit_bump
        if: steps.bump_version.outputs.version_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: Auto-bump version to ${{ steps.bump_version.outputs.version }}"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: obtainium-plus-apks-${{ steps.bump_version.outputs.version }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.bump_version.outputs.tag || format('v{0}', steps.bump_version.outputs.version) || 'latest' }}
          name: "Obtainium+ ${{ steps.bump_version.outputs.version || 'Latest Build' }}"
          commit: ${{ steps.commit_bump.outputs.sha || github.sha }}
          draft: false
          prerelease: ${{ inputs.beta || false }}
          generateReleaseNotes: true
          artifacts: "build/app/outputs/flutter-apk/*.apk"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          skipIfReleaseExists: false
          body: |
            **Obtainium+ Build #${{ steps.bump_version.outputs.build_number || 'Unknown' }}**

            ### Version Info
            - **Version**: ${{ steps.bump_version.outputs.version || 'Latest' }}
            - **Commit**: [`${{ steps.commit_bump.outputs.sha || github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ steps.commit_bump.outputs.sha || github.sha }})
            - **Build Date**: ${{ github.event.head_commit.timestamp }}

            ### Installation
            1. Download `app-release.apk` below
            2. Enable 'Install from Unknown Sources' in Android settings
            3. Install the APK

            ### Changes in this build
            ${{ steps.build_changelog.outputs.changelog }}

            ---

            📥 **[Download Latest](https://github.com/${{ github.repository }}/releases/latest)** | 📝 **[All Releases](https://github.com/${{ github.repository }}/releases)**

            🤖 *Built with [Claude Code](https://claude.com/claude-code) and GitHub Actions*

  sync-sentry-issues:
    needs: build
    uses: ./.github/workflows/sentry-sync.yml
    secrets: inherit
    permissions:
      issues: write
