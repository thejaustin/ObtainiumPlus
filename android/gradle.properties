org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# cronet_http still applies the Kotlin Gradle plugin, which AGP 9's built-in
# Kotlin rejects. Keep the standalone Kotlin plugin until it is migrated.
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Legacy plugins (flutter_js, ...) pin Kotlin jvmTarget 1.8 while Java compiles at 11; KGP 2.4 treats that as an error.
kotlin.jvm.target.validation.mode=warning
